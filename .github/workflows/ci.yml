name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils
      - name: chmod tools
        run: chmod +x bin/basaltc bin/basm bin/stage0 bin/pe_tool 2>/dev/null || true
      - name: selftest
        run: |
          cp -f bin/basalt_rt.o /tmp/basalt_rt.o
          chmod +x scripts/selftest.sh
          ./scripts/selftest.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: tree
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Depth 2 | Select-Object FullName
      - name: packaging files present
        shell: pwsh
        run: |
          Test-Path packaging/windows/build_msi.ps1
          Test-Path packaging/windows/wix/Product.wxs
